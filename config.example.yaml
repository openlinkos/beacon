# Beacon configuration. Every credential is a *_file path: put the secret in that file (mode 0600)
# and keep the file out of git. `beacon check-config -config <this file>` validates it.

listen: ":17001"
data_dir: /var/lib/beacon                   # the SQL database (beacon.db), recordings, the admin socket
# Where the state lives: one SQL database, SQLite by default. A first start with an old bbolt file
# (status.db) beside it migrates that file into the database in one go; the old file stays as
# status.db.pre-sql to roll back to (what changed after the migration is not in it). A WAL database
# is one file plus its -wal and -shm side files and cannot live on a network file system.
storage:
  driver: sqlite                            # sqlite (one file, no services) or postgres
  # path: /var/lib/beacon/beacon.db         # sqlite: default <data_dir>/beacon.db
  # dsn_file: /etc/beacon/secrets/postgres-dsn   # postgres: a file holding the connection string, e.g.
  #   postgres://beacon@db.example.com:5432/beacon?sslmode=require — the password, if any, is in the
  #   file too; never in this YAML. `beacon storage migrate --to postgres` copies a SQLite database
  #   into it in one transaction, with the counts checked
  audit:
    checkpoint_interval: 24h                # how often the audit log's hash chain gets a signed checkpoint
    retention: 8760h                        # how long audit entries are kept (365 days)
  sqlite:
    journal_mode: wal                       # wal (recommended), delete, truncate, persist or memory
    synchronous: full                       # full (recommended: every commit is on the disk first), normal or off
    busy_timeout: 15s
  postgres:
    pool_size: 4                            # read connections; writes take one connection of their own
    statement_timeout: 15s                  # bounds a statement that hangs before it holds the writer
# High availability: a primary and a standby over one PostgreSQL database, one active at a time.
# The primary renews a lease in the database; when it stops, the standby takes the lease within
# ha.expire and /healthz answers 200 again — before that it answers 503, so the load balancer or
# the VIP in front sends traffic to the primary alone. Recordings shared by the pair
# (ssh.recordings: s3) and the state in the database make the switch complete. On SQLite this is
# refused: the file belongs to one process.
# ha:
#   enabled: true
#   name: beacon                            # the lease's name; both instances name the same
#   renew: 5s                               # how often the primary renews
#   expire: 15s                             # how long the lease lasts; the switch takes about this
# The catalogue, probe targets and modules live in the database (docs/guide/monitoring.md). These files are
# imported once, into a database that holds none yet; after that only on SIGHUP (when nothing was changed
# through Beacon since the last import) or with `beacon config import DIR`.
catalog_dir: /etc/beacon/catalog            # probe locations, heartbeats, expiring resources, status pages (*.yaml)
# The public status pages are in the catalogue too, under status_pages (docs/guide/status-pages.md); for example, in
# /etc/beacon/catalog/status_pages.yaml:
#   status_pages:
#     - name: public                        # served at /status/public; default: true also at /status
#       title: Example Status
#       host: uptime.example.com            # optional: at / on this host name, behind the same proxy
#       components:
#         - {name: website, title: Website, services: [example.com]}   # the probe targets' service labels
#         - {name: mirrors, title: Mirrors, page: mirrors}            # every service with a target labelled page: mirrors
#       links: {home: "https://example.com/", privacy: "https://example.com/privacy"}
# The days of their 90-day history begin at midnight in the timezone below.
# Beacon's own address, behind the TLS proxy: the links it hands out (the console, its one-time setup,
# invitation and reset links, the alerts' pages) and the issuer MCP clients sign in with (docs/guide/people.md).
public_url: https://status.example.com
# The reverse proxy in front (its address as the service sees it), so the API sees real client addresses.
trusted_proxies: [172.16.0.0/12]
language: zh                                # language of cards and chat messages: zh or en
timezone: Asia/Shanghai                     # times on cards

# The rule engine (vmalert or Prometheus) posts its alerts to the gateway's /api/v2/alerts, as it would
# to Alertmanager (vmalert: -notifier.url=http://beacon:17006 -notifier.bearerTokenFile=<file>).
rules:
  token_file: /etc/beacon/secrets/rules-token   # at least 24 random characters

# What Alertmanager's route and inhibit_rules did. Values in match, source and target are regular
# expressions over the whole label value.
routing:
  group_by: [alertname, service]
  group_wait: 30s          # after a group's first alert, wait for more before the card
  group_interval: 2m       # then update it at most this often
  resolve_timeout: 5m      # an alert the rule engine stops sending resolves after this
  routes:                  # the first match changes the grouping
    - match: {alertname: MainlandPathDegraded|ServiceDegraded}
      group_by: [alertname, severity]   # one card for many services
  inhibit:                 # mute targets while a source fires with the same equal labels
    - source: {alertname: HostDown}
      target: {alertname: ServiceDown|ServiceDegraded}
      equal: [failure_domain]

# Where the probes' results are: the gateway writes there, cards show each location's result.
victoriametrics:
  url: http://victoriametrics:8428

# The gateway for machines: probes and hosts write here with tokens from 'beacon enroll' and fetch
# what to check, job hosts push heartbeats, the rule engine and Flux post alerts. The gateway labels
# everything a probe writes with its location; see README.
gateway:
  listen: ":17006"
  targets_dir: /etc/beacon/targets          # all-*.yaml, overseas-*.yaml, mainland-*.yaml, <location>-*.yaml; imported as above
  # modules_file: /etc/beacon/targets/modules.yml   # the probe modules (this is the default); imported as above

# The SSH channel: agents reach machines with their own ssh, scp, sftp or rsync, or with the MCP tools,
# and never hold a key. On when ca_key_file is set; see docs/guide/machines.md. Both keys: ssh-keygen -t ed25519.
ssh:
  listen: ":17002"
  public_address: ssh.example.com:17002     # where agents connect, for the ssh_config Beacon hands out
  host_key_file: /etc/beacon/secrets/ssh-host-key   # the channel's own host key
  ca_key_file: /etc/beacon/secrets/ssh-ca-key       # signs a certificate for every connection to a machine
  # source_addresses: [203.0.113.7/32]      # certificates then work only from Beacon's own addresses
  keep: 4320h                               # sessions and their recordings are kept 180 days
  # recordings: s3                          # dir (the default, under data_dir) or an S3-compatible bucket
  #                                          # both machines of an HA pair read and write; needed there
  # recordings_s3:
  #   endpoint: https://s3.example.com       # or http://10.0.0.5:9000 for MinIO on a private network
  #   region: us-east-1
  #   bucket: beacon-recordings
  #   access_key_id_file: /etc/beacon/secrets/s3-access-key-id
  #   secret_access_key_file: /etc/beacon/secrets/s3-secret-access-key

links:
  # {service} and {alertname} are filled in; an alert's own runbook/dashboard annotation wins.
  grafana_service: "https://grafana.example.com/d/beacon-service/service?var-service={service}"
  runbook: "https://github.com/example/ops/blob/main/runbooks/{alertname}.md"

# The pages people open from the chat: an alert's timeline and each session's replay, under /console at
# public_url above, reached by signed links (no login). Anyone holding a link sees that page until it
# expires, so the chat the links go to must be private. See docs/guide/console.md.
pages:
  link_ttl: 720h                            # links are valid 30 days

# The public pages: / is the default status page, or without one a page that names the deployment and
# offers the console's sign-in. See docs/guide/status-pages.md.
branding:
  title: Example Operations                 # that page's title (Beacon when left out)
  powered_by: true                          # false leaves "Powered by Beacon, open source" out of the public pages' footer

# How MCP clients (Claude Code, Codex) sign in to Beacon. See docs/guide/people.md.
oauth:
  client_id_documents: true                 # false when Beacon cannot reach the internet: clients then register themselves

feishu:
  # The self-built app (cards, button callbacks, buzz). See docs/integrations/feishu.md.
  app_id_file: /etc/beacon/secrets/feishu-app-id
  app_secret_file: /etc/beacon/secrets/feishu-app-secret
  domain: feishu                            # feishu (open.feishu.cn) or lark (open.larksuite.com)
  callback: websocket                       # websocket: Feishu's long connection; http: POST /hooks/feishu
  # verification_token_file: …              # http callbacks only
  # encrypt_key_file: …                     # http callbacks, when encryption is on
  chat_id: oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  on_call:                                  # only they may act on cards; they are buzzed on escalation
    - {open_id: ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx, name: Alex}
  monthly_budget: 10000                     # the app's API calls per month (Feishu's free-plan limit)
  # The group's custom bot: plain messages, no API quota. Used for info alerts, over budget, and echoes.
  webhook_url_file: /etc/beacon/secrets/feishu-webhook-url
  # webhook_secret_file: …                  # when the bot signs requests
  webhook_keyword: Beacon                   # when the bot's security setting is a keyword

pushover:
  user_key_file: /etc/beacon/secrets/pushover-user-key
  token_file: /etc/beacon/secrets/pushover-app-token
  retry: 60s                                # emergency alerts repeat this often until acknowledged
  expire: 3h                                # and stop after this long

# bark:
#   url_file: /etc/beacon/secrets/bark-url   # https://api.day.app/<key>

healthchecks:
  # Pinged every minute while the bridge can deliver alerts (/fail when it cannot).
  bridge_url_file: /etc/beacon/secrets/healthchecks-bridge-url

escalation:
  critical: {channel: app, buzz: 10m, pushover: 15m}
  warning: {channel: app}
  info: {channel: webhook}

ack_ttl: 4h                                 # an acknowledgement lapses after this; escalation starts again

# Hooks that wake agents when a new alert group is first notified, telling them where the evidence is
# (public_url above). Beacon calls no model: what to do is the agent's call. See docs/guide/on-call.md.
agents:
  - name: claude-oncall
    kind: webhook                           # a JSON POST, signed: X-Beacon-Signature: sha256=<HMAC of the body>
    url: https://agents.example.com/hooks/beacon
    secret_file: /etc/beacon/secrets/agent-hook-secret   # at least 24 random characters
    # headers_file: /etc/beacon/secrets/agent-hook-headers   # "Name: value" lines for a receiver that checks its own secret; then secret_file is optional
    severities: [critical]                  # the default
    # service: "hub-.*|git-.*"              # a regular expression over the whole service label
    resolved: true                          # also call when the group resolves
  # - name: ops-workflow
  #   kind: github                          # a workflow_dispatch with the inputs alert and event
  #   repository: example/ops
  #   workflow: oncall.yml
  #   ref: main
  #   token_file: /etc/beacon/secrets/github-dispatch-token   # Actions: read and write on the repository

# Change events (deployments, Flux) that senders post to the gateway with a changes:write token.
changes:
  keep: 720h                                # 30 days
