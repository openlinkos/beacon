{{define "content"}}<div class="ol-stack">
<section class="ol-panel">
  <div class="ol-panel-header"><h2 class="ol-panel-title">{{icon "user"}} {{.Heading}}</h2></div>
  <div class="ol-panel-body"><dl class="ol-dl ol-dl-stack">{{range .Facts}}<dt>{{.K}}</dt><dd class="ol-break">{{if .Href}}<a href="{{.Href}}">{{.V}}</a>{{else}}{{.V}}{{end}}</dd>{{end}}</dl></div>
</section>
{{if .Person}}
<form class="ol-panel" method="post" action="{{console "/account/password"}}">
  <div class="ol-panel-header"><h2 class="ol-panel-title">{{icon "key-round"}} {{.L.Change}}</h2></div>
  <div class="ol-panel-body ol-stack"><input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="text" name="username" value="{{.Who}}" autocomplete="username" hidden>
    <div class="ol-field"><label class="ol-label" for="current">{{.L.Current}}</label><input class="ol-input" id="current" name="current" type="password" autocomplete="current-password" required maxlength="1024"></div>
    <div class="ol-field"><label class="ol-label" for="password">{{.L.New}}</label><input class="ol-input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="1024"></div>
    <div class="ol-field"><label class="ol-label" for="again">{{.L.Again}}</label><input class="ol-input" id="again" name="again" type="password" autocomplete="new-password" required minlength="10" maxlength="1024"></div>
    <p class="ol-hint">{{.Help}}</p>
  </div>
  <div class="ol-panel-footer"><span></span><button type="submit" class="ol-btn ol-btn-primary ol-btn-sm">{{iconSm "check"}}{{.L.Save}}</button></div>
</form>
{{else}}<div class="ol-alert ol-alert-info" role="status">{{icon "users"}}<div class="ol-alert-body"><p>{{.L.TokenNote}}</p></div></div>{{end}}
</div>{{end}}
