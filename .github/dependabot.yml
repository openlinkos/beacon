# Dependency updates: Go modules, GitHub Actions (pinned by commit SHA), the images' base images (pinned by
# digest), and the site's npm packages.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # the site (docs/package.json); the shared theme is released on its own schedule, so it is reviewed on its own
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      openlinkos:
        patterns: ["@openlinkos/*"]
      site:
        patterns: ["*"]
        exclude-patterns: ["@openlinkos/*"]
