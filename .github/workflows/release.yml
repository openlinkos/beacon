name: release

# Publishes a release when a v* tag is pushed: binaries, archives, SHA256SUMS (cosign keyless signature), SBOMs,
# a multi-platform image (signed), plus GitHub build provenance attestations for the binaries and the image;
# finally pulls the image anonymously from GHCR, verifies its signature and runs it once.
# See .goreleaser.yaml for the configuration.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # GitHub Release
      packages: write       # ghcr.io/openlinkos/beacon
      id-token: write       # cosign keyless, build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # when one commit has several tags (for example an -rc was released first), release the tag that
          # triggered this run
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: image digest
        id: image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/openlinkos/beacon:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openlinkos/beacon
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # after the release, pull the image anonymously, check its signature and that it runs
  verify:
    name: verify the published image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: pull, verify and run
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cosign verify "ghcr.io/openlinkos/beacon:$TAG" \
            --certificate-identity "https://github.com/openlinkos/beacon/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          docker run --rm "ghcr.io/openlinkos/beacon:$TAG" version
