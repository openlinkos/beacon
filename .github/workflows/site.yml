name: site

# Builds the site under docs/ and publishes it on Cloudflare Pages (project beacon-site). main is the site,
# which beacon.openlinkos.com serves; a pull request from a branch of this repository gets a preview of its
# own, at <branch>.<project>.pages.dev, linked in a comment on the pull request and kept up to date with each
# push. (Cloudflare names the project's address after the project, with a suffix when the name is taken.)
# The build is VitePress on @openlinkos/vitepress-theme, and fails when a Chinese page falls behind its English
# page or when the reference misses a route, an error code, a scope or an MCP tool (the ci workflow runs the same
# build on every pull request, forks included: secrets never reach a fork's pull request, so it gets no preview).
# After each deployment the smoke test (docs/smoke.sh) reads what was deployed: pages, languages, redirects,
# 404s, headers and the theme's files.
#
# Needs the secret CLOUDFLARE_API_TOKEN, a token that may edit Cloudflare Pages and nothing else, and the
# variable CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      # The changelog page includes it, and the navigation shows its newest version.
      - CHANGELOG.md
      - .github/workflows/site.yml
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/site.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.158.0
  PROJECT: beacon-site

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build the site
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs/.vitepress/dist
          include-hidden-files: true # .well-known/security.txt
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: publish on Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the comment with the preview's address
    environment:
      name: ${{ github.event_name == 'pull_request' && 'site-preview' || 'site' }}
      url: ${{ steps.deploy.outputs.alias || steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # a branch name is the pull request author's text: it reaches the shell only as a variable
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # the project, the first time (no grep -q: with pipefail it would stop wrangler early and fail the pipe)
          if ! npx --yes "$WRANGLER" pages project list | grep -w "$PROJECT" >/dev/null; then
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$SHA" \
            --commit-dirty=true 2>&1 | tee deploy.log
          # the addresses wrangler reports: this deployment's own, and the branch's alias
          url=$(grep -oE 'https://[0-9a-f]{8}\.[a-z0-9-]+\.pages\.dev' deploy.log | head -n 1)
          test -n "$url"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          alias=$(grep -i 'alias' deploy.log | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' | head -n 1 || true)
          echo "alias=$alias" >>"$GITHUB_OUTPUT"
      - name: smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash docs/smoke.sh "$URL"
      - name: the preview's address on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body="**Site preview:** ${ALIAS:-$URL}

          This commit ($SHA) on its own: $URL. The preview passed the site's smoke test."
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
