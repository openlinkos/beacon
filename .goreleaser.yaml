# Release process (.github/workflows/release.yml runs it when a v* tag is pushed):
#   - binaries and archives for linux/amd64 and arm64 (the Feishu SDK does not build for 32-bit platforms):
#     linkos-beacon (the service), linkos-probe (the probe agent, its own archive, also in the image) and
#     linkos-oncall (the harness that runs an agent when Beacon wakes it; its own archive, not in the image),
#     reproducible builds (-trimpath, timestamps taken from the commit time);
#   - SHA256SUMS, signed with cosign keyless (Sigstore, bundle SHA256SUMS.sigstore.json);
#   - one SPDX SBOM per archive (syft);
#   - multi-platform image ghcr.io/openlinkos/beacon: only copies the compiled binaries, carries
#     the SBOM generated by BuildKit, signed with cosign keyless; the build provenance attestation is generated by
#     attest-build-provenance in the workflow.
version: 2
project_name: linkos-beacon

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: beacon
    main: ./cmd/linkos-beacon
    binary: linkos-beacon
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openlinkos/beacon/internal/version.Version={{ .Version }}
      - -X github.com/openlinkos/beacon/internal/version.Commit={{ .FullCommit }}
      - -X github.com/openlinkos/beacon/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: probe
    main: ./cmd/linkos-probe
    binary: linkos-probe
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openlinkos/beacon/internal/version.Version={{ .Version }}
      - -X github.com/openlinkos/beacon/internal/version.Commit={{ .FullCommit }}
      - -X github.com/openlinkos/beacon/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: oncall
    main: ./cmd/linkos-oncall
    binary: linkos-oncall
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openlinkos/beacon/internal/version.Version={{ .Version }}
      - -X github.com/openlinkos/beacon/internal/version.Commit={{ .FullCommit }}
      - -X github.com/openlinkos/beacon/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: beacon
    ids: [beacon]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - config.example.yaml
  - id: probe
    ids: [probe]
    formats: [tar.gz]
    name_template: "linkos-probe_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
  - id: oncall
    ids: [oncall]
    formats: [tar.gz]
    name_template: "linkos-oncall_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - contrib/oncall/*
      - contrib/github/oncall.yml

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    output: true

dockers_v2:
  - id: beacon
    ids: [beacon, probe]
    images:
      - ghcr.io/openlinkos/beacon
    # pre-releases only get their own tag and do not update v0.1 or latest
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: linkos-beacon
      org.opencontainers.image.description: Status pages and closed-loop alerting with an API and MCP.
      org.opencontainers.image.url: https://github.com/openlinkos/beacon
      org.opencontainers.image.source: https://github.com/openlinkos/beacon
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0
    annotations:
      org.opencontainers.image.title: linkos-beacon
      org.opencontainers.image.description: Status pages and closed-loop alerting with an API and MCP.
      org.opencontainers.image.source: https://github.com/openlinkos/beacon
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
    sbom: true

docker_signs:
  - cmd: cosign
    args: ["sign", "${artifact}@${digest}", "--yes"]
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"

release:
  github:
    owner: openlinkos
    name: beacon
  prerelease: auto
  footer: |
    ## Verify

    ```bash
    # Binaries: check the signature of SHA256SUMS, then the archive against it
    cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
      --certificate-identity-regexp '^https://github.com/openlinkos/beacon/.github/workflows/release.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c SHA256SUMS

    # Image
    cosign verify ghcr.io/openlinkos/beacon:{{ .Tag }} \
      --certificate-identity-regexp '^https://github.com/openlinkos/beacon/.github/workflows/release.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify oci://ghcr.io/openlinkos/beacon:{{ .Tag }} -R openlinkos/beacon
    ```
