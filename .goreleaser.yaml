# Release process (.github/workflows/release.yml runs it when a v* tag is pushed):
#   - binaries and archives for linux/amd64, arm64 and arm/v7, reproducible builds (-trimpath, timestamps taken
#     from the commit time);
#   - SHA256SUMS, signed with cosign keyless (Sigstore, bundle SHA256SUMS.sigstore.json);
#   - one SPDX SBOM per archive (syft);
#   - multi-platform image ghcr.io/openlinkos/status: only copies the compiled binaries, carries
#     the SBOM generated by BuildKit, signed with cosign keyless; the build provenance attestation is generated by
#     attest-build-provenance in the workflow.
version: 2
project_name: linkos-status

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: status
    main: ./cmd/linkos-status
    binary: linkos-status
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openlinkos/status/internal/version.Version={{ .Version }}
      - -X github.com/openlinkos/status/internal/version.Commit={{ .FullCommit }}
      - -X github.com/openlinkos/status/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: status
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - config.example.yaml

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    output: true

dockers_v2:
  - id: status
    ids: [status]
    images:
      - ghcr.io/openlinkos/status
    # pre-releases only get their own tag and do not update v0.1 or latest
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      org.opencontainers.image.title: linkos-status
      org.opencontainers.image.description: Status pages and closed-loop alerting with an API and MCP.
      org.opencontainers.image.url: https://github.com/openlinkos/status
      org.opencontainers.image.source: https://github.com/openlinkos/status
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0
    annotations:
      org.opencontainers.image.title: linkos-status
      org.opencontainers.image.description: Status pages and closed-loop alerting with an API and MCP.
      org.opencontainers.image.source: https://github.com/openlinkos/status
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
    sbom: true

docker_signs:
  - cmd: cosign
    args: ["sign", "${artifact}@${digest}", "--yes"]
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"

release:
  github:
    owner: openlinkos
    name: status
  prerelease: auto
  footer: |
    ## Verify

    ```bash
    # Binaries: check the signature of SHA256SUMS, then the archive against it
    cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
      --certificate-identity-regexp '^https://github.com/openlinkos/status/.github/workflows/release.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c SHA256SUMS

    # Image
    cosign verify ghcr.io/openlinkos/status:{{ .Tag }} \
      --certificate-identity-regexp '^https://github.com/openlinkos/status/.github/workflows/release.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify oci://ghcr.io/openlinkos/status:{{ .Tag }} -R openlinkos/status
    ```
