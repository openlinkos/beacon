# VictoriaMetrics scrapes the centre itself, every 30 seconds (the try rules evaluate every 15): the
# catalogue's beacon_expected_location, which ProbeLocationDown in rules/probes.yml joins against. Probe
# results do not come this way: beacon-probe pushes them to the gateway, which labels them by token.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: beacon
    static_configs:
      - targets: [beacon:17001]
