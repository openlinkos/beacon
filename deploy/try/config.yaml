# Beacon's configuration for the try environment: one machine, no domain, no certificate, everything on
# the loopback interface. Every field is explained in config.example.yaml at the repository's root; the
# differences from deploy/config.yaml are the waits (shortened, so a broken service alerts within about
# two minutes) and public_url, which is plain http on localhost — the console's cookie is Secure,
# which localhost is allowed to carry, and MCP clients such as Claude Code accept a token endpoint on
# localhost over http.

listen: ":17001"
data_dir: /var/lib/beacon
catalog_dir: /etc/beacon/catalog
public_url: http://localhost:17001
language: en
timezone: UTC

# vmalert posts its alerts to the gateway with this token; up.sh generates it
rules:
  token_file: /etc/beacon/secrets/rules-token

routing:
  group_by: [alertname, service]
  group_wait: 5s          # a laptop demo: the card (here, the alert group) forms at once
  group_interval: 30s
  resolve_timeout: 1m

victoriametrics:
  url: http://victoriametrics:8428

gateway:
  listen: ":17006"
  targets_dir: /etc/beacon/targets

# The SSH channel (docs/guide/machines.md). up.sh generates both keys; the demo machine's sshd trusts the
# certificate authority's public key (secrets/ssh-ca-key.pub). Agents connect from this machine.
ssh:
  listen: ":17002"
  public_address: localhost:17002
  host_key_file: /etc/beacon/secrets/ssh-host-key
  ca_key_file: /etc/beacon/secrets/ssh-ca-key
  keep: 24h                # a trial needs no long memory

links:
  runbook: "https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/{alertname}.md"

changes:
  keep: 24h
