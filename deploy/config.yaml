# Beacon's configuration for the reference deployment. Every field is explained in config.example.yaml at the
# repository's root; this file keeps what the deployment needs. Paths are as the container sees them:
# compose.yaml mounts this directory's catalog/, targets/ and secrets/ under /etc/beacon.
# install.sh replaces status.example.com and metrics.example.com with the names in .env.

listen: ":17001"
data_dir: /var/lib/beacon
catalog_dir: /etc/beacon/catalog              # imported at the first start; docs/guide/monitoring.md
public_url: https://status.example.com
trusted_proxies: [172.16.0.0/12]               # Caddy, on the compose network; it rewrites X-Forwarded-For
language: en                                   # cards and chat messages: en or zh
timezone: UTC

# vmalert posts its alerts to the gateway with this token; install.sh generates it
rules:
  token_file: /etc/beacon/secrets/rules-token

routing:
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 2m
  resolve_timeout: 5m
  routes:
    # a network path or a CDN node failing takes many services with it: one card, not one per service
    - match: {alertname: MainlandPathDegraded|ServiceDegraded}
      group_by: [alertname, severity]
  inhibit:
    # a service that is down altogether is not also reported as partly down
    - source: {alertname: ServiceDown}
      target: {alertname: ServiceDegraded|MainlandPathDegraded}
      equal: [service]
    # the critical tier of an expiry alert mutes its warning tier
    - source: {severity: critical}
      target: {severity: warning}
      equal: [alertname, service]

victoriametrics:
  url: http://victoriametrics:8428

gateway:
  listen: ":17006"
  targets_dir: /etc/beacon/targets             # imported at the first start, with modules.yml

# Beacon's own backups: the database snapshot every hour, the recordings, this configuration and
# the secrets directory every day, encrypted to public keys (with none configured, a key pair is
# generated at the first start and the private key is left in /var/lib/beacon/backup/
# RECOVERY-MATERIAL.txt — take it off the machine and keep it somewhere safe). The compose file
# carries the local directory to the host; add an s3: destination to send a copy off the machine.
backup:
  destinations:
    - dir: /var/lib/beacon/backups

# The SSH channel (docs/guide/machines.md). install.sh generates both keys.
ssh:
  listen: ":17002"
  public_address: status.example.com:17002     # where agents connect
  host_key_file: /etc/beacon/secrets/ssh-host-key
  ca_key_file: /etc/beacon/secrets/ssh-ca-key
  # source_addresses: [203.0.113.7/32]         # this machine's public address: certificates then work only from it
  keep: 4320h                                  # sessions and recordings are kept 180 days

links:
  runbook: "https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/{alertname}.md"

# The chat and the phones. Until a section below is filled in, alerts are recorded and shown in the API and MCP,
# and nobody is notified. Put each secret in the file named, under ./secrets (owner 65532, mode 0400), then
# uncomment the section and restart beacon. Feishu: docs/integrations/feishu.md.
# feishu:
#   app_id_file: /etc/beacon/secrets/feishu-app-id
#   app_secret_file: /etc/beacon/secrets/feishu-app-secret
#   domain: feishu                             # feishu or lark
#   callback: websocket                        # the long connection; no public URL needed
#   chat_id: oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   on_call:
#     - {open_id: ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx, name: Alex}
#   monthly_budget: 10000
#   webhook_url_file: /etc/beacon/secrets/feishu-webhook-url   # the group's custom bot: echoes, info alerts
#   webhook_keyword: Beacon
#
# pushover:
#   user_key_file: /etc/beacon/secrets/pushover-user-key
#   token_file: /etc/beacon/secrets/pushover-app-token
#
# healthchecks:                                # the dead man's switch: pinged every minute while alerts can be delivered
#   bridge_url_file: /etc/beacon/secrets/healthchecks-bridge-url
#
# escalation:                                  # the defaults, once the sections above exist
#   critical: {channel: app, buzz: 10m, pushover: 15m}
#   warning: {channel: app}
#   info: {channel: webhook}

# Hooks that wake agents when a new alert group is first notified (docs/guide/on-call.md).
# agents:
#   - name: claude-oncall
#     kind: webhook
#     url: https://agents.example.com/hooks/beacon
#     secret_file: /etc/beacon/secrets/agent-hook-secret
#     severities: [critical]
#     resolved: true

changes:
  keep: 720h                                   # change events (deployments, Flux) are kept 30 days
