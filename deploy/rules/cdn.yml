# CDN nodes against their clusters' DNS rotations. For every location in the catalogue with an address and a
# rotation, Beacon resolves both every minute and exports beacon_location_in_rotation{location, rotation, role},
# beacon_rotation_unknown_address{rotation, address} and beacon_rotation_resolve_success{rotation}.
# A primary node that is up and probing but not in the answers serves nobody. A standby node (standby: true in
# the catalogue, role="standby") is out of the rotation by design, and in it only when a primary has failed.
# An answer no location claims is a node nobody watches. A rotation that does not resolve yields no verdict.
groups:
  - name: cdn
    interval: 1m
    rules:
      - alert: CDNNodeOutOfRotation
        expr: max by (location, rotation) (beacon_location_in_rotation{role!="standby"}) == 0
        for: 15m
        labels:
          severity: warning
          service: "{{ $labels.rotation }}"
          failure_domain: "{{ $labels.rotation }}"
        annotations:
          summary: "{{ $labels.location }} is not in the DNS rotation {{ $labels.rotation }}"
          description: "{{ $labels.rotation }} does not answer with the address of {{ $labels.location }}: the node is up but serves no users through it. Taken out on purpose, or dropped by the CDN's health check?"
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CDNNodeOutOfRotation.md

      - alert: CDNStandbyInRotation
        expr: max by (location, rotation) (beacon_location_in_rotation{role="standby"}) == 1
        for: 5m
        labels:
          severity: info
          service: "{{ $labels.rotation }}"
          failure_domain: "{{ $labels.rotation }}"
        annotations:
          summary: "Standby node {{ $labels.location }} is serving in {{ $labels.rotation }}"
          description: "The standby node {{ $labels.location }} is in the DNS answers of {{ $labels.rotation }}: a primary node failed or was taken out. See which one with CDNNodeOutOfRotation, and take the standby out again once the primary is back."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CDNNodeOutOfRotation.md

      - alert: CDNRotationUnknownAddress
        expr: max by (rotation, address) (beacon_rotation_unknown_address) == 1
        for: 30m
        labels:
          severity: warning
          service: "{{ $labels.rotation }}"
          failure_domain: "{{ $labels.rotation }}"
        annotations:
          summary: "{{ $labels.rotation }} answers with {{ $labels.address }}, which no probe location claims"
          description: "A node in the rotation is not in the catalogue, so nobody watches it. Add it as a probe location with its address, or take it out of the rotation."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CDNNodeOutOfRotation.md

      - alert: CDNRotationResolveFailing
        expr: max by (rotation) (beacon_rotation_resolve_success) == 0
        for: 10m
        labels:
          severity: warning
          service: "{{ $labels.rotation }}"
          failure_domain: "{{ $labels.rotation }}"
        annotations:
          summary: "{{ $labels.rotation }} does not resolve from the monitoring host"
          description: "Beacon cannot resolve {{ $labels.rotation }}. Either the rotation's DNS is broken, and the sites on that CDN cluster fail for everyone, or the monitoring host's resolver is."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CDNNodeOutOfRotation.md
