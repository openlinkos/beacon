# vmalert-tool unittest --disableAlertgroupLabel --files 'deploy/rules/tests/*.yml'
# Four probe locations: edge-1, edge-2, edge-3 (overseas) and cn-1 (mainland). Every scenario is fine for the
# first 6 samples in the minute-cadence cases and then fails as described. A location counts as failing
# when its last success leaves the 3-minute window. ServiceDown waits another 40 seconds, the warnings 5 minutes.
rule_files:
  - ../probes.yml
evaluation_interval: 10s

tests:
  - name: one location failing is not an outage
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-2",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-3",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="cn-1",region="mainland"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: MainlandPathDegraded
        exp_alerts: []
    metricsql_expr_test:
      - expr: beacon:service_up
        eval_time: 16m
        exp_samples:
          - labels: '{__name__="beacon:service_up",service="example.com",severity="critical",failure_domain="origin-1"}'
            value: 1

  - name: half of the locations failing for 40 seconds raises an outage that clears when quorum breaks
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="warning",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="example.com",severity="warning",failure_domain="origin-1",location="cn-1",region="mainland"}'
        values: '1x5 0x3 1x15'
      - series: 'probe_success{job="probe",service="example.com",severity="warning",failure_domain="origin-1",location="edge-2",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="example.com",severity="warning",failure_domain="origin-1",location="edge-3",region="overseas"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 8m30s
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 8m40s
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              service: example.com
              severity: warning
              failure_domain: origin-1
            exp_annotations:
              summary: example.com is down
              beacon_rule_active_at: ""
              description: example.com has failed for 3 minutes from at least half of the probe locations that report it (and at least two). The card lists each location's result and why it failed.
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDown.md
      - eval_time: 10m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: MainlandPathDegraded
        exp_alerts: []
    metricsql_expr_test:
      - expr: beacon:service_up
        eval_time: 9m30s
        exp_samples:
          - labels: '{__name__="beacon:service_up",service="example.com",severity="warning",failure_domain="origin-1"}'
            value: 0

  - name: two locations recovering while the rule is pending never raise an outage
    interval: 10s
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="critical",location="edge-1",region="overseas"}'
        values: '1 0x19 1x12'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",location="edge-2",region="overseas"}'
        values: '1 0x19 1x12'
    alert_rule_test:
      - eval_time: 3m20s
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 3m50s
        alertname: ServiceDown
        exp_alerts: []
    metricsql_expr_test:
      - expr: 'max_over_time(probe_success[3m])'
        eval_time: 3m20s
        exp_samples:
          - labels: '{__name__="probe_success",job="probe",service="example.com",severity="critical",location="edge-1",region="overseas"}'
            value: 0
          - labels: '{__name__="probe_success",job="probe",service="example.com",severity="critical",location="edge-2",region="overseas"}'
            value: 0

  - name: a target without a severity label is critical when down
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="plain.example.com",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="plain.example.com",location="edge-2",region="overseas"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              service: plain.example.com
              severity: critical
            exp_annotations:
              summary: plain.example.com is down
              beacon_rule_active_at: ""
              description: plain.example.com has failed for 3 minutes from at least half of the probe locations that report it (and at least two). The card lists each location's result and why it failed.
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDown.md

  # The gateway sets job to the kind of token that wrote a sample: what a host or a heartbeat token writes in a
  # probe's name is not a probe's result, so it neither outvotes the locations nor raises an outage of its own.
  - name: results written by anything but a probe location do not count
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="plain.example.com",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="plain.example.com",location="edge-2",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="host",host="worker-1",service="plain.example.com",location="edge-3",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="host",host="worker-1",service="plain.example.com",location="edge-4",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="heartbeat",heartbeat="nas-backup",service="plain.example.com",location="cn-1",region="mainland"}'
        values: '1x25'
      - series: 'probe_success{job="host",host="worker-1",service="quiet.example.com",location="edge-1",region="overseas"}'
        values: '0x25'
      - series: 'probe_success{job="host",host="worker-1",service="quiet.example.com",location="edge-2",region="overseas"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              service: plain.example.com
              severity: critical
            exp_annotations:
              summary: plain.example.com is down
              beacon_rule_active_at: ""
              description: plain.example.com has failed for 3 minutes from at least half of the probe locations that report it (and at least two). The card lists each location's result and why it failed.
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDown.md

  # The recorded series count only as the rule engine records them, without a job. A series of a recorded name
  # with a job came through the gateway from a machine, which the gateway no longer passes: failing locations
  # made up that way neither raise a partial outage nor turn the service down.
  - name: recorded series count only from the rule engine
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-2",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="cn-1",region="mainland"}'
        values: '1x25'
      - series: 'beacon:probe_failing{job="probe",host="edge-3",service="example.com",severity="critical",failure_domain="origin-1",location="ghost-1",region="overseas"}'
        values: '1x25'
      - series: 'beacon:probe_failing{job="probe",host="edge-3",service="example.com",severity="critical",failure_domain="origin-1",location="ghost-2",region="overseas"}'
        values: '1x25'
      - series: 'beacon:service_failing_locations{job="host",host="worker-1",service="example.com",severity="critical",failure_domain="origin-1"}'
        values: '4x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: ServiceDegraded
        exp_alerts: []
    metricsql_expr_test:
      - expr: beacon:service_up{job=""}
        eval_time: 16m
        exp_samples:
          - labels: '{__name__="beacon:service_up",service="example.com",severity="critical",failure_domain="origin-1"}'
            value: 1

  - name: fewer than half failing is a partial outage, a warning
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="app.example.com",severity="critical",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="app.example.com",severity="critical",failure_domain="origin-1",location="edge-2",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="app.example.com",severity="critical",failure_domain="origin-1",location="edge-3",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="app.example.com",severity="critical",failure_domain="origin-1",location="edge-4",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="app.example.com",severity="critical",failure_domain="origin-1",location="cn-1",region="mainland"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceDegraded
        exp_alerts:
          - exp_labels:
              service: app.example.com
              severity: warning
              failure_domain: origin-1
            exp_annotations:
              summary: app.example.com fails from some probe locations
              description: "app.example.com has failed for 3 minutes from at least two probe locations, but fewer than half of them: a partial outage, usually one CDN node or one network path. The card shows which locations."
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDegraded.md

  - name: with one location's data late, two of the three reporting is still an outage
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-2",region="overseas"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-3",region="overseas"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              service: example.com
              severity: critical
              failure_domain: origin-1
            exp_annotations:
              summary: example.com is down
              beacon_rule_active_at: ""
              description: example.com has failed for 3 minutes from at least half of the probe locations that report it (and at least two). The card lists each location's result and why it failed.
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDown.md

  - name: when only one location reports, its failure is never an outage
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="example.com",severity="critical",failure_domain="origin-1",location="edge-1",region="overseas"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceDegraded
        exp_alerts: []

  - name: the mainland location failing while the overseas ones succeed is a path problem
    interval: 1m
    input_series:
      - series: 'probe_success{job="probe",service="cdn.example.com",severity="critical",failure_domain="cdn",location="cn-1",region="mainland"}'
        values: '1x5 0x20'
      - series: 'probe_success{job="probe",service="cdn.example.com",severity="critical",failure_domain="cdn",location="edge-1",region="overseas"}'
        values: '1x25'
      - series: 'probe_success{job="probe",service="cdn.example.com",severity="critical",failure_domain="cdn",location="edge-2",region="overseas"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 16m
        alertname: MainlandPathDegraded
        exp_alerts:
          - exp_labels:
              service: cdn.example.com
              severity: warning
              failure_domain: cdn
            exp_annotations:
              summary: cdn.example.com is unreachable from mainland China
              description: "Every mainland probe location has failed cdn.example.com for 3 minutes while the overseas ones succeed: most likely the path from mainland China (a blocked address or routing), not the service itself."
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/MainlandPathDegraded.md

  - name: a probe location without results is reported
    interval: 1m
    input_series:
      - series: 'beacon_expected_location{job="beacon",location="edge-1",region="overseas",network="BGP"}'
        values: '1x15'
      - series: 'beacon_expected_location{job="beacon",location="cn-1",region="mainland",network="BGP"}'
        values: '1x15'
      - series: 'beacon_expected_location{job="beacon",location="edge-3",region="overseas",network="CN2 GIA"}'
        values: '1x15'
      - series: 'probe_success{job="probe",service="example.com",location="edge-1",region="overseas"}'
        values: '1x15'
      - series: 'probe_success{job="probe",service="example.com",location="cn-1",region="mainland"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: ProbeLocationDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ProbeLocationDown
        exp_alerts:
          - exp_labels:
              location: edge-3
              region: overseas
              network: CN2 GIA
              severity: warning
              service: probe-edge-3
              failure_domain: probe-edge-3
            exp_annotations:
              summary: Probe location edge-3 has sent no results for 10 minutes
              description: "No probe results from edge-3 (CN2 GIA). The machine, its beacon-probe or its path to the gateway is down; the agent queues results on disk and fills the gap when it is back."
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ProbeLocationDown.md

  # Only Beacon's own scrape says which locations should report, and only a location's own results keep it up.
  - name: a location is expected by the catalogue and kept up by its own results only
    interval: 1m
    input_series:
      - series: 'beacon_expected_location{job="beacon",location="edge-3",region="overseas",network="CN2 GIA"}'
        values: '1x15'
      - series: 'probe_success{job="host",host="worker-1",service="example.com",location="edge-3",region="overseas"}'
        values: '1x15'
      - series: 'beacon_expected_location{job="probe",host="edge-1",location="ghost",region="overseas",network="BGP"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: ProbeLocationDown
        exp_alerts:
          - exp_labels:
              location: edge-3
              region: overseas
              network: CN2 GIA
              severity: warning
              service: probe-edge-3
              failure_domain: probe-edge-3
            exp_annotations:
              summary: Probe location edge-3 has sent no results for 10 minutes
              description: "No probe results from edge-3 (CN2 GIA). The machine, its beacon-probe or its path to the gateway is down; the agent queues results on disk and fills the gap when it is back."
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ProbeLocationDown.md

  - name: the ordinary failure was already pending before the operator armed the drill at 3m20s
    interval: 10s
    input_series:
      - series: 'probe_success{job="probe",service="drill",severity="critical",failure_domain="monitoring",location="edge-1",region="overseas"}'
        values: '1 0x30'
      - series: 'probe_success{job="probe",service="drill",severity="critical",failure_domain="monitoring",location="edge-2",region="overseas"}'
        values: '1 0x30'
    metricsql_expr_test:
      - expr: 'sum(ALERTS{alertname="ServiceDown",alertstate="pending",service="drill"})'
        eval_time: 3m10s
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 3m20s
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 3m40s
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              service: drill
              severity: critical
              failure_domain: monitoring
            exp_annotations:
              summary: drill is down
              beacon_rule_active_at: "946684980000"
              description: drill has failed for 3 minutes from at least half of the probe locations that report it (and at least two). The card lists each location's result and why it failed.
              runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ServiceDown.md
