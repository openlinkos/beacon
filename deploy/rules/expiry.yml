# Things that run out: resources in the catalogue (machines, domains, tokens: beacon_resource_expiry_timestamp_seconds),
# certificates seen by the probes (probe_ssl_earliest_cert_expiry), and heartbeats of scheduled jobs
# (beacon_heartbeat_max_age_seconds from the catalogue, beacon_heartbeat_last_success_timestamp_seconds from the jobs).
groups:
  - name: expiry
    interval: 5m
    rules:
      - alert: ResourceExpiring
        expr: |
          (max by (resource, kind) (beacon_resource_expiry_timestamp_seconds) - time()) < 30 * 86400
          and
          (max by (resource, kind) (beacon_resource_expiry_timestamp_seconds) - time()) >= 7 * 86400
        labels:
          severity: warning
          service: "{{ $labels.resource }}"
          failure_domain: "{{ $labels.resource }}"
        annotations:
          summary: "{{ $labels.kind }} {{ $labels.resource }} expires in {{ $value | humanizeDuration }}"
          description: "Renew {{ $labels.resource }}, or let it lapse on purpose; then put the new date in the catalogue (catalog/resources.yaml, or through the API) so that this alert ends."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ResourceExpiring.md

      - alert: ResourceExpiring
        expr: (max by (resource, kind) (beacon_resource_expiry_timestamp_seconds) - time()) < 7 * 86400
        labels:
          severity: critical
          service: "{{ $labels.resource }}"
          failure_domain: "{{ $labels.resource }}"
        annotations:
          summary: "{{ $labels.kind }} {{ $labels.resource }} expires in {{ $value | humanizeDuration }}"
          description: "Renew {{ $labels.resource }}, or let it lapse on purpose; then put the new date in the catalogue (catalog/resources.yaml, or through the API) so that this alert ends."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/ResourceExpiring.md

      # The earliest expiry any location sees, so that one certificate is reported once, not once per location.
      # Let's Encrypt renews 30 days ahead: 14 days left means renewal has failed twice over.
      - alert: CertificateExpiring
        expr: |
          (min by (service, failure_domain) (probe_ssl_earliest_cert_expiry{job="probe"}) - time()) < 14 * 86400
          and
          (min by (service, failure_domain) (probe_ssl_earliest_cert_expiry{job="probe"}) - time()) >= 7 * 86400
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.service }} expires in {{ $value | humanizeDuration }}"
          description: "Automatic renewal has not happened (Let's Encrypt renews 30 days ahead). Check whatever issues the certificate: the reverse proxy, cert-manager, the CDN."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CertificateExpiring.md

      - alert: CertificateExpiring
        expr: (min by (service, failure_domain) (probe_ssl_earliest_cert_expiry{job="probe"}) - time()) < 7 * 86400
        labels:
          severity: critical
        annotations:
          summary: "The certificate of {{ $labels.service }} expires in {{ $value | humanizeDuration }}"
          description: "Automatic renewal has not happened (Let's Encrypt renews 30 days ahead). Check whatever issues the certificate: the reverse proxy, cert-manager, the CDN."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/CertificateExpiring.md

  - name: heartbeats
    interval: 1m
    rules:
      # A heartbeat may arrive as a steady series (the probe agent's textfile directory) or as one pushed sample,
      # so the last value within 31 days counts, not the current one.
      - record: beacon:heartbeat_last_success
        expr: max by (heartbeat) (last_over_time(beacon_heartbeat_last_success_timestamp_seconds[31d]))

      # at the heartbeat's own severity, from the catalogue
      - alert: HeartbeatStale
        expr: |
          (time() - beacon:heartbeat_last_success)
          > on (heartbeat) group_left (severity)
          max by (heartbeat, severity) (beacon_heartbeat_max_age_seconds)
        labels:
          service: "{{ $labels.heartbeat }}"
          failure_domain: "{{ $labels.heartbeat }}"
        annotations:
          summary: "{{ $labels.heartbeat }} has not succeeded for {{ $value | humanizeDuration }}"
          description: "The job behind heartbeat {{ $labels.heartbeat }} did not report success within its max_age. Check whether it ran, and whether it failed."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/HeartbeatStale.md

      # listed in the catalogue but never reported: a new heartbeat gets a day to succeed once
      - alert: HeartbeatMissing
        expr: |
          max by (heartbeat, severity) (beacon_heartbeat_max_age_seconds)
          unless on (heartbeat) beacon:heartbeat_last_success
        for: 1d
        labels:
          service: "{{ $labels.heartbeat }}"
          failure_domain: "{{ $labels.heartbeat }}"
        annotations:
          summary: "{{ $labels.heartbeat }} has never reported"
          description: "Heartbeat {{ $labels.heartbeat }} is in the catalogue, but no success has been reported in 31 days. Check that the job ends with beacon-heartbeat, or pushes with its token."
          runbook: https://github.com/openlinkos/beacon/blob/main/deploy/runbooks/HeartbeatStale.md
