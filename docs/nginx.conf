# Static file server inside the site image (not deployment configuration).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a proxy, redirects keep the scheme and host the reader used.
    absolute_redirect off;

    # The pages moved when the site was rearranged; their old addresses stay, as redirects.
    location = /install          { return 301 /self-hosting/install; }
    location = /accounts         { return 301 /guide/people; }
    location = /agents           { return 301 /guide/on-call; }
    location = /ssh              { return 301 /guide/machines; }
    location = /catalog          { return 301 /guide/monitoring; }
    location = /status           { return 301 /guide/status-pages; }
    location = /pages            { return 301 /guide/console; }
    location = /feishu           { return 301 /integrations/feishu; }
    location = /troubleshooting  { return 301 /self-hosting/troubleshooting; }
    location = /sources          { return 301 /reference/sources; }
    location = /goals            { return 301 /about/goals; }
    location = /architecture     { return 301 /about/architecture; }
    location = /zh/install          { return 301 /zh/self-hosting/install; }
    location = /zh/accounts         { return 301 /zh/guide/people; }
    location = /zh/agents           { return 301 /zh/guide/on-call; }
    location = /zh/ssh              { return 301 /zh/guide/machines; }
    location = /zh/catalog          { return 301 /zh/guide/monitoring; }
    location = /zh/status           { return 301 /zh/guide/status-pages; }
    location = /zh/pages            { return 301 /zh/guide/console; }
    location = /zh/feishu           { return 301 /zh/integrations/feishu; }
    location = /zh/troubleshooting  { return 301 /zh/self-hosting/troubleshooting; }
    location = /zh/sources          { return 301 /zh/reference/sources; }
    location = /zh/goals            { return 301 /zh/about/goals; }
    location = /zh/architecture     { return 301 /zh/about/architecture; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # VitePress clean URLs: /reference/api is served from /reference/api.html. Pages are revalidated so
    # that updates show up behind a CDN.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
