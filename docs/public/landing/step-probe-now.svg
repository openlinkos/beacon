  <text x="28" y="40" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">probe_now</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="28" y="82" fill="#e2e8f0"><tspan fill="#34d399" font-weight="600">$</tspan> probe_now service=demo-web</text>
    <text x="28" y="126" fill="#e2e8f0">edge-1  <tspan fill="#34d399">ok</tspan>  http_status 200</text>
