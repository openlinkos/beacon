<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="The evidence a failing service produces">
  <rect x="0.5" y="0.5" width="639" height="239" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="28" y="40" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">evidence</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="28" y="82" fill="#f87171">demo-web is down</text>
    <text x="28" y="126" fill="#e2e8f0">service   demo-web</text>
    <text x="28" y="152" fill="#e2e8f0">instance  http://demo:8080/healthz</text>
    <text x="28" y="178" fill="#e2e8f0">location  edge-1</text>
    <text x="28" y="204" fill="#e2e8f0">reason    <tspan fill="#f87171">connect — connection refused</tspan></text>
  </g>
</svg>
