<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-label="A terminal where an agent repairs the demo web server">
  <rect x="0.5" y="0.5" width="719" height="403" rx="10" fill="#0f172a" stroke="#334155"/>
  <circle cx="28" cy="24" r="6" fill="#f87171"/>
  <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
  <circle cx="68" cy="24" r="6" fill="#34d399"/>
  <text x="360" y="29" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">demo-owner / try-agent on demo</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="28" y="76" fill="#e2e8f0"><tspan fill="#34d399" font-weight="600">$</tspan> wget -q -T 2 -O- http://127.0.0.1:8080/healthz</text>
    <text x="28" y="102" fill="#94a3b8">wget: can't connect to remote host (127.0.0.1):</text>
    <text x="44" y="126" fill="#94a3b8">Connection refused</text>
    <text x="28" y="170" fill="#e2e8f0"><tspan fill="#34d399" font-weight="600">$</tspan> start-web</text>
    <text x="28" y="196" fill="#94a3b8">the demo web server is started</text>
    <text x="28" y="222" fill="#34d399">{"status":"ok"}</text>
    <text x="28" y="310" fill="#e2e8f0"><tspan fill="#34d399" font-weight="600">$</tspan> </text>
    <rect x="44" y="296" width="10" height="20" fill="#94a3b8"/>
  </g>
</svg>
